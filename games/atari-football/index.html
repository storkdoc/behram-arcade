<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta name="description" content="Atari Football: top-down Atari 800 XL style football. Secret play calling, online peer-to-peer two player, vs computer and local 2-player.">
<title>Atari Football</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  body { position: fixed; inset: 0; font-family: "Courier New", monospace; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  #home { position: fixed; top: calc(env(safe-area-inset-top) + 6px); left: calc(env(safe-area-inset-left) + 8px); color: #5060a0; font: bold 12px "Courier New", monospace;
    text-decoration: none; letter-spacing: 1px; z-index: 5; padding: 4px 6px; }
  #home:hover { color: #fff; }
  .ingame #home { display: none; }
  /* ---------- touch controls (only on touch devices, only during play) ---------- */
  #touch { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: none; }
  .touch #touch.show { display: block; }
  .tzone { position: absolute; left: 0; top: 15%; bottom: 0; width: 48%; pointer-events: auto; touch-action: none; }
  .tbase { position: absolute; left: calc(env(safe-area-inset-left) + 90px); top: auto; bottom: calc(env(safe-area-inset-bottom) + 20px); width: 120px; height: 120px; margin: 0 0 0 -60px;
    border-radius: 50%; border: 3px solid rgba(160, 180, 255, .45); background: rgba(30, 40, 120, .25); pointer-events: none; transform: none; }
  .tbase.on { bottom: auto; margin: -60px 0 0 -60px; border-color: rgba(255, 255, 255, .7); }
  .tknob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; border-radius: 50%; transform: translate(-50%, -50%);
    background: rgba(255, 255, 255, .55); box-shadow: 0 0 0 3px rgba(48, 72, 176, .8) inset; }
  .tbtn { position: absolute; border-radius: 50%; pointer-events: auto; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font: bold 13px "Courier New", monospace; letter-spacing: 1px; border: 3px solid rgba(255, 255, 255, .6); box-sizing: border-box; }
  .tbtn b { font-size: 24px; line-height: 24px; }
  .tbtn span { font-size: 10px; margin-top: 2px; }
  .tbtn.down { filter: brightness(1.6); transform: scale(.94); }
  .ta { width: 96px; height: 96px; right: calc(env(safe-area-inset-right) + 18px); bottom: calc(env(safe-area-inset-bottom) + 22px); background: rgba(220, 60, 60, .55); }
  .tb { width: 74px; height: 74px; right: calc(env(safe-area-inset-right) + 124px); bottom: calc(env(safe-area-inset-bottom) + 96px); background: rgba(60, 110, 230, .55); }
  .tp { width: 44px; height: 44px; right: calc(env(safe-area-inset-right) + 10px); top: calc(env(safe-area-inset-top) + 8px); background: rgba(40, 40, 80, .6); border-width: 2px; }
  .tp b { font-size: 15px; }
  /* ---------- rotate hint for phones held upright ---------- */
  #rotate { display: none; position: fixed; inset: 0; z-index: 20; background: #1d4f9c; color: #9cc8ff; align-items: center; justify-content: center; flex-direction: column;
    font: bold 18px "Courier New", monospace; text-align: center; letter-spacing: 2px; padding: 20px; box-sizing: border-box; }
  #rotate .ph { width: 46px; height: 80px; border: 4px solid #fff; border-radius: 8px; margin-bottom: 26px; animation: rot 2.4s ease-in-out infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(0) } 60%, 100% { transform: rotate(-90deg) } }
  .portrait #rotate { display: flex; }
  #codeInput { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; font-size: 16px; border: 0; padding: 0; z-index: -1; }
</style>
<script src="../../assets/js/mood-sticker.js"></script>
</head>
<body>
<a id="home" href="../../index.html">&larr; ARCADE</a>
<div id="wrap"><canvas id="screen" width="480" height="300" aria-label="Atari Football game screen"></canvas></div>
<div id="touch"></div>
<div id="rotate"><div class="ph"></div>ROTATE YOUR PHONE<br>TO PLAY ATARI FOOTBALL</div>
<input id="codeInput" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="5" aria-label="Room code">
<script src="peerjs.min.js"></script>
<script src="js/font.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/field.js"></script>
<script src="js/plays.js"></script>
<script src="js/ai.js"></script>
<script src="js/sim.js"></script>
<script src="js/net.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/touch.js"></script>
<script src="js/main.js"></script>
</body>
</html>
