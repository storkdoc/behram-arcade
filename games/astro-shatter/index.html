<style>
  html, body { margin: 0; height: 100%; background: #020309; overflow: hidden; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  body { position: fixed; inset: 0; }
  #scene, #hud { position: fixed; left: 0; top: 0; display: block; touch-action: none; outline: none; }
  #hud { z-index: 2; }
  #safe { position: fixed; inset: 0; pointer-events: none; visibility: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #home { position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: calc(env(safe-area-inset-left) + 10px); z-index: 5;
    color: #aab3d8; font: 700 13px -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; letter-spacing: 1px; text-decoration: none;
    padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,.45); }
  #home:hover { color: #fff; }
  .ingame #home { display: none; }
</style>
</head>
