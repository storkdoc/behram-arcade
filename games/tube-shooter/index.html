<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VORTEX">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:,">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>VORTEX — Behram Arcade</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none;overscroll-behavior:none;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  body.showcursor{cursor:default}
  canvas{display:block;position:fixed;left:0;top:0;width:100vw;height:100vh;background:#000;touch-action:none}
  #crt{position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,0,0,.55) 100%);
    mix-blend-mode:multiply}
  #back{position:fixed;left:calc(14px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));font:600 12px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;
    color:#ff3df5;text-decoration:none;padding:7px 11px;border:1px solid rgba(255,61,245,.5);border-radius:6px;
    text-shadow:0 0 6px #ff3df5;box-shadow:0 0 10px rgba(255,61,245,.25) inset;opacity:.45;transition:opacity .2s;z-index:5;cursor:pointer}
  #back:hover{opacity:1}
  /* ---------- touch controls (built by game.js, only on touch devices) ---------- */
  body.touch #back{opacity:.8;padding:11px 14px;display:none}
  body.touch[data-ts="menu"] #back, body.touch[data-ts="paused"] #back{display:block}
  #tprobe{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #tc>div{position:fixed;display:none;z-index:6;box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none}
  #tc .tctl{align-items:center;justify-content:center;font:800 14px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;
    --c:#ffe81a;--g:255,232,26;color:var(--c);border:2px solid var(--c);border-radius:50%;background:rgba(var(--g),.06);opacity:.6;
    box-shadow:0 0 12px rgba(var(--g),.35),inset 0 0 14px rgba(var(--g),.22);text-shadow:0 0 6px var(--c)}
  #tc .tctl.on{opacity:1;background:rgba(var(--g),.3)}
  #tc svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  #tc #tfire{--c:#ff47e6;--g:255,71,230;font-size:19px}
  #tc #tfire.hot{--c:#ff8a3d;--g:255,138,61}
  #tc #tzap{--c:#36e6ff;--g:54,230,255}
  #tc #tzap.used{opacity:.22}
  #tc #tstart{--c:#2bff4c;--g:43,255,76;font-size:17px}
  #tc #tleft,#tc #tright{border-radius:20px}
  #tc #tleft svg,#tc #tright svg{fill:currentColor;width:46%;height:46%}
  #tc #tmode{border-radius:16px;font-size:11px;letter-spacing:.08em;opacity:.5}
  #tc #tmode.on{opacity:1}
  #tc .tsq{border-radius:11px;--c:#9fb4ff;--g:159,180,255}
  #tc .tsq.off{--c:#7a7a8a;--g:122,122,138}
  #tc #tknob{pointer-events:none;flex-direction:column}
  #tknob i{position:absolute;inset:7%;border-radius:50%;
    background:repeating-conic-gradient(rgba(255,232,26,.55) 0 3deg, transparent 3deg 15deg);
    -webkit-mask:radial-gradient(circle, transparent 0 62%, #000 64%);mask:radial-gradient(circle, transparent 0 62%, #000 64%)}
  #tknob i::after{content:"";position:absolute;left:50%;top:2%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff;box-shadow:0 0 8px #ffe81a}
  #tknob b{font-size:11px;opacity:.85;letter-spacing:.2em}
  #tkeys .tkey{display:flex;align-items:center;justify-content:center;margin:2px;border:1.5px solid rgba(54,230,255,.75);border-radius:8px;
    color:#fff;font:700 16px/1 ui-monospace,Menlo,Consolas,monospace;background:rgba(5,1,15,.7);box-shadow:0 0 8px rgba(54,230,255,.25)}
  #tkeys .tkey.fn{color:#ffe81a;border-color:rgba(255,232,26,.8);font-size:13px}
  #tkeys .tkey.on{background:#36e6ff;color:#000}
  body[data-ts="game"]:not(.arrows) #tspin, body[data-ts="game"]:not(.arrows) #tknob,
  body[data-ts="game"].arrows #tleft, body[data-ts="game"].arrows #tright, body[data-ts="select"] #tleft, body[data-ts="select"] #tright,
  body[data-ts="game"] #tmode, body[data-ts="game"] #tfire, body[data-ts="game"] #tzap, body[data-ts="select"] #tstart,
  body[data-ts="game"] #tpause, body[data-ts="paused"] #tpause, body.touch #tmute, body.touch.fsok #tfs{display:flex}
  body[data-ts="initials"] #tkeys{display:grid}
  body[data-ts="initials"] #tfs, body[data-ts="initials"] #tmute{display:none}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="crt"></div>
<a id="back" href="../../index.html">&#9664; BACK TO ARCADE</a>
<script src="game.js"></script>
</body>
</html>
