<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e2136">
<title>CONGRESSIONAL OB GYN — Clinic Day — Behram Arcade</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<script>
/* Visible error banner with RELOAD instead of a blank screen (real iPhones give no console). */
(function () {
  var shown = false;
  window.COBFatal = function (msg) {
    if (shown) return; shown = true;
    var show = function () {
      var d = document.createElement('div'); d.id = 'fatal';
      d.textContent = 'CONGRESSIONAL OB GYN hit a problem on this device:\n' + msg + '\n';
      var b = document.createElement('button'); b.textContent = 'RELOAD'; b.onclick = function () { location.reload(); }; d.appendChild(b);
      document.body.appendChild(d);
    };
    if (document.body) show(); else addEventListener('DOMContentLoaded', show);
  };
  var booted = function () { return window.COB && window.COB.booted; };
  addEventListener('error', function (e) { if (!(e instanceof ErrorEvent)) return; if (!booted()) COBFatal((e.message || 'script error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); else if (window.COB && COB.softError) COB.softError(e.message); }, true);
  addEventListener('unhandledrejection', function (e) { if (!booted()) COBFatal('startup: ' + ((e.reason && (e.reason.message || e.reason)) || 'unknown')); });
  var dog = function (n) { if (booted()) return; if (!window.COB && n === 0) COBFatal('The game did not start (scripts failed to load). Check your connection and reload.'); else if (n >= 3) COBFatal('The game is taking very long to start on this device. Try RELOAD.'); else setTimeout(function () { dog(n + 1); }, 20000); };
  setTimeout(function () { dog(0); }, 20000);
  /* block pinch / double-tap zoom (iOS ignores user-scalable=no) */
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  var lastTouch = 0; document.addEventListener('touchend', function (e) { var t = Date.now(); if (t - lastTouch < 320 && e.target && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) e.preventDefault(); lastTouch = t; }, { passive: false });
  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
})();
</script>
</head>
<body>
<div id="scene" aria-hidden="true"></div>
<canvas id="fx"></canvas>
<a id="home" href="../../">←<span> ARCADE</span></a>

<header id="hud" class="hidden">
  <div class="hud-l"><span class="hud-logo">CONGRESSIONAL <b>OB GYN</b></span><span id="hud-mode" class="chip"></span></div>
  <div class="hud-c">
    <div class="stat"><small>SCORE</small><b id="hud-score">0</b></div>
    <div class="stat"><small>STREAK</small><b id="hud-streak">0</b><i id="hud-mult"></i></div>
    <div class="stat clock"><small>CLINIC</small><b id="hud-clock">8:30</b></div>
    <div class="stat lvl"><small id="hud-lvl">MS3</small><div class="xpbar"><i id="hud-xp"></i></div></div>
  </div>
  <div class="hud-r">
    <button id="btn-music" class="icon nav-skip" title="Music (N)" aria-label="Music">♫</button>
    <button id="btn-mute" class="icon nav-skip" title="Sound (M)" aria-label="Sound">🔊</button>
  </div>
</header>

<main id="screens">
  <section id="s-loading" class="screen show"><div class="load-card"><div class="load-logo">CONGRESSIONAL <b>OB GYN</b></div><div class="load-bar"><i></i></div><div class="load-sub">Opening the clinic…</div></div></section>
  <section id="s-gate" class="screen"></section>
  <section id="s-title" class="screen"></section>
  <section id="s-hub" class="screen"></section>
  <section id="s-enc" class="screen"></section>
  <section id="s-summary" class="screen"></section>
  <section id="s-mastery" class="screen"></section>
  <section id="s-board" class="screen"></section>
  <section id="s-badges" class="screen"></section>
  <section id="s-help" class="screen"></section>
</main>
<div id="modal" class="hidden"></div>
<div id="door" class="hidden"><div class="door-frame"><div class="door-leaf"><div class="door-num"></div><div class="door-handle"></div><div class="door-chart"></div></div></div></div>
<div id="toasts"></div>

</body>
</html>
