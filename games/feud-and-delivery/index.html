<script>
/* Visible error banner with RELOAD instead of a blank screen (real iPhones give no console). */
(function () {
  var shown = false;
  window.FEUDFatal = function (msg) {
    if (shown) return; shown = true;
    var show = function () {
      var d = document.createElement('div'); d.id = 'fatal';
      d.textContent = 'FEUD & DELIVERY hit a problem on this device:\n' + msg + '\n';
      var b = document.createElement('button'); b.textContent = 'RELOAD'; b.onclick = function () { location.reload(); }; d.appendChild(b);
      document.body.appendChild(d);
    };
    if (document.body) show(); else addEventListener('DOMContentLoaded', show);
  };
  var booted = function () { return window.FEUD && window.FEUD.booted; };
  addEventListener('error', function (e) { if (!(e instanceof ErrorEvent)) return; if (!booted()) FEUDFatal((e.message || 'script error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); }, true);
  addEventListener('unhandledrejection', function (e) { if (!booted()) FEUDFatal('startup: ' + ((e.reason && (e.reason.message || e.reason)) || 'unknown')); });
  setTimeout(function () { if (!booted()) FEUDFatal('The game did not start (scripts failed to load). Check your connection and reload.'); }, 25000);
  /* block pinch / double-tap zoom (iOS ignores user-scalable=no) */
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  var lastTouch = 0; document.addEventListener('touchend', function (e) { var t = Date.now(); if (t - lastTouch < 320 && e.target && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { e.preventDefault(); var el = e.target.closest && e.target.closest('button, a, [data-nav]'); if (el && !el.disabled) el.click(); } lastTouch = t; }, { passive: false });
  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
})();
</script>
