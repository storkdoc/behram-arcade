<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070b14">
<meta name="description" content="RELAX: a top-down Martian sand table. A hidden magnet draws a steel ball through rust-red sand while a rover and an astronaut wander the bowl.">
<title>RELAX</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/relax.css">
<script src="../../assets/js/mood-sticker.js"></script>
</head>
<body>
<canvas id="view" aria-label="RELAX sand table"></canvas>
<div id="ui">
  <a id="home" href="../../index.html">&larr; ARCADE</a>
  <div id="controls">
    <button type="button" id="btn-next">Next</button>
    <button type="button" id="btn-fx" aria-pressed="true">Effects</button>
    <button type="button" id="btn-mute" aria-pressed="false" aria-label="Mute">Mute</button>
    <button type="button" id="btn-hint" aria-label="Show hint">Hint</button>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
  </div>
  <div id="hint">
    <p>A hidden magnet draws the steel ball through the sand.</p>
    <p>Space or Next changes the pattern. Enter or Effects shifts the glow. Drag, arrows, or a stick to nudge. M mutes.</p>
  </div>
  <div id="foot">
    <div id="pattern">Spiral</div>
    <div id="now">Tap or press a key for music</div>
  </div>
</div>
<script src="js/patterns.js"></script>
<script src="js/sand.js"></script>
<script src="js/actors.js"></script>
<script src="js/music.js"></script>
<script src="js/main.js"></script>
</body>
</html>
