<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05010f">
<title>BEHRAM ARCADE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000'/%3E%3Cpath d='M12 46 L32 10 L52 46 Z' fill='none' stroke='%23ff47e6' stroke-width='5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/arcade.css">
</head>
<body>
<div class="hall" aria-hidden="true">
  <div class="tubes"><i></i><i></i></div>
  <div class="aura" id="aura"></div>
</div>
<canvas class="floor" id="floor" aria-hidden="true"></canvas>

<section class="carousel" id="carousel" aria-roledescription="carousel" aria-label="Arcade games">
  <div class="track" id="track"></div>
</section>

<header class="marquee">
  <h1 class="sign" aria-label="Behram Arcade">
    <span class="sign-top" aria-hidden="true">BEHRAM</span>
    <span class="sign-bottom" aria-hidden="true">ARCADE</span>
  </h1>
  <p class="tag">INSERT COIN &middot; <span class="blink">A NEW GAME EVERY DAY</span></p>
</header>

<div class="bottom">
  <p class="caption" id="caption"><span class="press" id="press">PRESS START</span></p>
  <footer>
    <span id="hint">&#9664; &#9654; SELECT &nbsp;&middot;&nbsp; ENTER PLAY</span>
    <span id="count"></span>
    <button type="button" class="mute" id="mute" aria-pressed="false" aria-label="Sound on" title="Sound (M)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="on" d="M16 8.5a5 5 0 0 1 0 7M18.6 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M16.5 9.5l5 5m0-5l-5 5"/></svg>
    </button>
  </footer>
</div>
<p class="sr-only" id="live" aria-live="polite"></p>
<div class="fade" id="fade" aria-hidden="true"></div>

<script src="games.js"></script>
<script src="assets/arcade.js"></script>
</body>
</html>
